# Qwen3-8B actor + colocated vLLM rollout with server-side LoRA.
#
# The base model remains frozen. Tinker scalar prompt-logprob requests for the
# initial model are evaluated with the adapter disabled, while normal rollout
# requests use the latest synchronized adapter weights.

server:
  model_name: ${oc.env:TINKER_SERVER_MODEL_NAME,Qwen/Qwen3-8B}
  host: ${oc.env:TINKER_SERVER_HOST,0.0.0.0}
  port: ${oc.env:TINKER_SERVER_PORT,8000}
  ray_address: ${oc.env:RAY_ADDRESS,local}
  checkpoint_dir: ${oc.env:TINKER_CHECKPOINT_DIR,/tmp/tinker-checkpoints}
  server_max_runtime: ${oc.env:TINKER_SERVER_MAX_RUNTIME,null}
  max_concurrent_samples: ${oc.env:TINKER_SERVER_MAX_CONCURRENT_SAMPLES,32}
  enable_offload: true
  auto_merge_verl_default_config: true

actor_rollout_ref:
  actor:
    strategy: fsdp
    # Unlike the standalone GRPO recipe, Tinker expects KL to be folded into
    # client-computed advantages rather than applied by the server actor.
    use_kl_loss: false
    entropy_coeff: 0
    ppo_mini_batch_size: 32
    use_dynamic_bsz: true
    ppo_max_token_len_per_gpu: 12288
    ppo_micro_batch_size_per_gpu: 1
    fsdp_config:
      model_dtype: bfloat16
      param_offload: false
      optimizer_offload: false
      # PEFT's adapter export needs original parameter views. With FSDP1's
      # default (false), get_peft_model_state_dict can expose FlatParameter
      # shards as 1-D lora_A/lora_B tensors during rollout synchronization.
      use_orig_params: true
    optim:
      lr_scheduler_type: constant
      lr: 3.0e-6
  rollout:
    name: vllm
    mode: async
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    n: 5
    prompt_length: 512
    response_length: 2048
    max_num_seqs: 128
    max_num_batched_tokens: 4096
    enable_chunked_prefill: true
    calculate_log_probs: true
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 12288
    log_prob_micro_batch_size_per_gpu: 1
    free_cache_engine: true
    enforce_eager: false
    load_format: safetensors
    engine_kwargs:
      vllm:
        disable_custom_all_reduce: true
    # The current per-unit collector checks leaf-local names (usually just
    # "weight") for "lora_", so it misses FSDP-wrapped LoRA leaf modules.
    # With use_orig_params=true, the root summon below preserves matrix shapes.
    layered_summon: false
    checkpoint_engine:
      # Keep the rank-64 Qwen3-8B adapter in one transfer bucket. Newer VeRL
      # also supports adapters spanning multiple buckets.
      update_weights_bucket_megabytes: 2048
  ref:
    enable: false
  model:
    path: ${oc.env:TINKER_SERVER_MODEL_PATH,Qwen/Qwen3-8B}
    use_remove_padding: true
    enable_gradient_checkpointing: true
    trust_remote_code: true
    # VeRL's FSDP LoRA configuration.
    lora_rank: 64
    lora_alpha: 32
    target_modules: all-linear
    lora_adapter_path: null


trainer:
  logger:
  - console
  project_name: verl_tinker_server
  experiment_name: qwen3_8b_lora_vllm_fsdp
  nnodes: 1
  n_gpus_per_node: ${oc.env:TINKER_SERVER_N_GPUS_PER_NODE,2}
